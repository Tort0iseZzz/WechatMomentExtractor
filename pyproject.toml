[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-moment-extractor"
version = "1.2.0"
description = "微信朋友圈及评论只读查看、筛选与 JSON 备份工具"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["cryptography==46.0.5"]

[project.optional-dependencies]
build = ["pyinstaller==6.19.0"]

[project.scripts]
wechat-moment-extractor = "wechatauto.app:main"

[project.urls]
Repository = "https://github.com/Tort0iseZzz/WechatMomentExtractor"
Issues = "https://github.com/Tort0iseZzz/WechatMomentExtractor/issues"

[tool.setuptools.packages.find]
include = ["wechatauto*"]
